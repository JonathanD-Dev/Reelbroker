# nginx pour ReelBroker sur Amazon Linux 2023 (remplace /etc/nginx/nginx.conf ; l'original est sauvegardé par install.sh).
# Sert l'interface (web/dist) et transmet /api/ à l'API FastAPI, qui n'écoute que sur 127.0.0.1:8000.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_tokens off;
    client_max_body_size 256k;
    # Compression faite ici : CloudFront ne compresse pas quand le cache est désactivé.
    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- Plafonds d'appels qui peuvent coûter des appels Bedrock -------------------------------------
    # Clé constante : plafond pour TOUS les visiteurs ensemble (derrière CloudFront, l'adresse vue ici est
    # celle de CloudFront, pas celle du visiteur). Une clé vide n'est pas comptée.
    # Création ou modification d'un profil : chacune prépare jusqu'à 8 fiches (1 ou 2 appels Bedrock par fiche).
    map "$request_method:$uri" $af_profile_key {
        "~^(POST|PUT):/api/profile(/[^/]+(/tolerance)?)?$" "all";
        default "";
    }
    # Fiches, vérification d'une idée, pipeline : un ou deux appels Bedrock quand le texte n'est pas en cache.
    map $uri $af_ai_key {
        "~^/api/(card/|check$|pipeline/)" "all";
        default "";
    }
    limit_req_zone $af_profile_key zone=af_profile:1m rate=6r/m;
    limit_req_zone $af_ai_key zone=af_ai:1m rate=30r/m;
    limit_req_status 429;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /opt/alphaforge/web/dist;
        index index.html;

        # Mot de passe du site (facultatif) : fichier écrit par install.sh, vide si SITE_USER n'est pas fourni.
        include /etc/nginx/alphaforge-auth.conf;

        # Fichiers produits par Vite : leur nom change à chaque build, ils peuvent être gardés longtemps.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # index.html : jamais gardé (sinon une mise à jour n'apparaît pas). L'application route par « #/ ».
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location / {
            try_files $uri /index.html;
        }

        location /api/ {
            limit_req zone=af_profile burst=10 nodelay;
            limit_req zone=af_ai burst=20 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Une fiche jamais calculée peut prendre jusqu'à environ une minute (même délai que le client).
            proxy_read_timeout 90s;
            add_header Cache-Control "no-store" always;
        }
    }
}
